name: Update GitHub stats cards

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download stats cards
        run: |
          mkdir -p profile
          curl -fsSL "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=Rothezee&theme=tokyonight" -o profile/stats.svg
          curl -fsSL "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=Rothezee&theme=tokyonight" -o profile/langs.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/langs.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore: update GitHub stats cards"
          git push
